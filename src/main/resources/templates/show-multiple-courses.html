<html xmlns:th="http://www.thymeleaf.org" >
	
<body>
	
	<h1>Atzīmes:</h1>
	<table border="1px">
		<tr>
			<td>Id</td>
			<td>Nosaukums</td>
			<td>Kredītpunkti</td>
			<td>Professora vārds</td>
			<td>Professora uzvārds</td>
			<td>Professora grāds</td>
		</tr>
		<th:block th:each="course : ${package}">
		<tr>
			<td th:text="${course.idc}" ></td>
			<td th:text="${course.title}" ></td>
			<td th:text="${course.creditpoints}" ></td>
			<td th:each="prof: ${course.professor}">
				<p th:text="${prof.name}"></p>
				<p th:text="${prof.surname}"></p>
				<p th:text="${prof.degree}"></p>
			</td>
			
		</tr>
		</th:block>
	</table>
	

	
</body>



</html>
